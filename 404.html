<!doctype html>
<html lang="zh-CN">

          </div>
          <aside class="hero-panel">

              <li class="meta-item">

        "/skills/": "/skills.html",
        "/skills/index.html": "/skills.html",
        "/wechat/": "/wechat.html",
        "/wechat/index.html": "/wechat.html",
      }
      const target = redirects[location.pathname]
      if (target) location.replace(target + location.search + location.hash)
    </script>
    <script type="module" src="/assets/site.js"></script>

<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="8" y1="6" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="body" x1="20" y1="22" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg)"/>
  <!-- 尾巴：DNA 螺旋风格两条尾羽（小尺寸友好） -->
  <path d="M22 37 C 13 35, 11 29, 13 22" stroke="#5eead4" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M22 41 C 12 40, 10 34, 12 27" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- 身体（带描边增强分离度） -->
  <ellipse cx="34" cy="40" rx="12.5" ry="10" fill="url(#body)" stroke="#93c5fd" stroke-width="1.2"/>
  <!-- 翅膀点缀 -->
  <path d="M30 38 Q 27 34 30 31 Q 33 34 33 37 Z" fill="#93c5fd"/>
  <!-- 头（带描边） -->
  <circle cx="42" cy="28" r="7.2" fill="url(#body)" stroke="#93c5fd" stroke-width="1.2"/>
  <!-- 鸡冠：饱满单块 -->
  <path d="M37 24 Q 35.5 16 40.5 15 Q 41 19 43 19.5 Q 44 13 48.5 15 Q 47.5 19 49 21 L 49 24 Z" fill="#f87171"/>
  <!-- 嘴（加大） -->
  <path d="M48.5 27.5 L 56 29 L 48.5 32.5 Z" fill="#fbbf24" stroke="#d97706" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- 眼睛 -->
  <circle cx="43.5" cy="27" r="1.6" fill="#1e293b"/>
  <circle cx="44" cy="26.5" r="0.5" fill="#ffffff"/>
  <!-- 腿 -->
  <path d="M30 49 L29 55 M38 49 L39 55" stroke="#fdba74" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M25 55 L29 55 L33 55 M34 55 L39 55 L44 55" stroke="#fdba74" stroke-width="2.2" stroke-linecap="round"/>
</svg>
